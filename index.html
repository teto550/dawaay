// ===== الخريطة (Leaflet + OpenStreetMap) =====
let map = null, circ = null, umk = null, pl = null, rt;
async function loadLeaflet() {
  if (window.L) return true;
  await new Promise(ok => {
    const l = document.createElement('link'); l.rel = 'stylesheet'; l.href = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css'; document.head.appendChild(l);
    const t = document.createElement('script'); t.src = 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; t.onload = ok; t.onerror = ok; document.head.appendChild(t);
  });
  return !!window.L;
}
async function initMap() {
  const el = $('#map');
  if (map) { try { map.remove(); } catch (e) {} map = null; }
  if (!el) return;
  if (!await loadLeaflet()) { el.innerHTML = '<p class="muted" style="padding:10px">تعذر تحميل الخريطة (اتأكد من الإنترنت).</p>'; return; }
  map = L.map(el).setView(loc, 12);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom:19, attribution:'© OpenStreetMap' }).addTo(map);
  umk = L.marker(loc, { draggable:true, icon:L.divIcon({ html:'<div style="font-size:30px;line-height:30px">📍</div>', className:'', iconSize:[30, 30], iconAnchor:[15, 30] }) }).addTo(map);
  circ = L.circle(loc, { radius:rad * 1000, color:'#0e5f57', fillOpacity:.08 }).addTo(map);
  pl = L.layerGroup().addTo(map);
  const mv = ll => { loc = [ll.lat, ll.lng]; localStorage.setItem('dv_loc', JSON.stringify(loc)); umk.setLatLng(ll); circ.setLatLng(ll); updRes(); };
  umk.on('dragend', () => mv(umk.getLatLng())); map.on('click', e => mv(e.latlng));
  map.fitBounds(circ.getBounds()); markers();
}
function markers() {
  if (!pl || !map) return;
  pl.clearLayers();
  lastRes.forEach(r => L.circleMarker([r.p.lat, r.p.lng], { radius:8, color:'#b3261e', fillColor:'#b3261e', fillOpacity:.8 }).bindPopup(esc(r.p.name) + '<br>' + r.km.toFixed(1) + ' كم').addTo(pl));
}
function setRad(v) {
  rad = v; $('#rv').textContent = v;

  clearTimeout(rt); rt = setTimeout(updRes, 150);
}

const setAm = v => { keepAuth(); am = v; render(); };

const togglePw = () => { keepAuth(); showPw = !showPw; render(); };
const authScreen = () => `<div class="auth"><div class="hero"><div class="logo">💊</div><h2>دوائي</h2><p>لاقي دواءك في أقرب صيدلية، وشوف السعر والكمية قبل ما تتحرك</p></div>
  <div class="card"><div class="seg"><button class="${am=='in'?'on':''}" onclick="setAm('in')">تسجيل الدخول</button><button class="${am=='up'?'on':''}" onclick="setAm('up')">حساب جديد</button></div>
  ${am == 'up' ? `<div class="lbl">هتسجّل كـ</div><div class="roles">
    <div class="rc ${arole=='p'?'on':''}" onclick="setRole('p')"><span>🙋</span><b>عميل</b><small>بدوّر على دواء</small></div>
    <div class="rc ${arole=='h'?'on':''}" onclick="setRole('h')"><span>🏥</span><b>صيدلية</b><small>بعرض أدويتي</small></div></div>` : ''}

  <label class="lbl" for="pw">الباسورد</label><div class="pw"><input id="pw" type="${showPw?'text':'password'}" placeholder="${am=='up'?'6 حروف على الأقل':'الباسورد'}" autocomplete="${am=='in'?'current-password':'new-password'}" value="${esc(ap)}" onkeydown="if(event.key=='Enter')doAuth()"><button class="sec eye" type="button" onclick="togglePw()">${showPw?'إخفاء':'إظهار'}</button></div>

async function doAuth() {
  const em = $('#em').value.trim(), pw = $('#pw').value;
  if (!em || !pw) return alert('اكتب الإيميل والباسورد.');
  try {
    if (am == 'in') await fa.signIn(fs.auth, em, pw);
    else { pend = arole; await fa.signUp(fs.auth, em, pw); }
  } catch (e) { pend = null; alert(errMsg(e.code)); }
}

      const app = a.initializeApp(FIREBASE_CONFIG);
      fs = { db:b.getFirestore(app), auth:c.getAuth(app), collection:b.collection, getDocs:b.getDocs, getDoc:b.getDoc, setDoc:b.setDoc, doc:b.doc, query:b.query, where:b.where };
      fa = { signIn:c.signInWithEmailAndPassword, signUp:c.createUserWithEmailAndPassword, out:c.signOut };
      c.onAuthStateChanged(fs.auth, async u => {
        user = u;
        if (u) { try { await load(); } catch (e) { alert('خطأ في تحميل البيانات: ' + e.message); } if (role == 'p' && me()) { syncPush(me().meds); syncNative(me().meds); } }
        else { role = null; my = null; S = { ph:[], inv:[], res:[], cu:[], bc:[] }; }

})();
</script>
