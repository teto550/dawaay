<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>دوائي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#12302c;--teal:#0e5f57;--mint:#e9f2ee;--card:#fff;--line:#cfdcd7;--mut:#5b756f;--red:#b3261e;--amber:#b45309}
*{box-sizing:border-box}
body{margin:0;font-family:Cairo,Tahoma,Arial,sans-serif;background:var(--mint);color:var(--ink);line-height:1.6}
header{background:var(--teal);color:#fff;padding:14px 18px;display:flex;justify-content:space-between;align-items:center}
header h1{margin:0;font-size:26px;font-weight:800}
header p{margin:0;opacity:.85;font-size:14px}
.pick{display:block;width:100%;text-align:right;padding:18px;margin:12px 0;border-radius:12px;background:#fff;color:var(--ink);border:2px solid var(--teal);font-size:19px;font-weight:800;white-space:normal}
.pick small{display:block;font-weight:400;font-size:14px;margin-top:2px}
.pick:hover{background:var(--teal);color:#fff}.pick:hover small{color:#cfe5e0}
nav{display:flex;gap:4px}
nav button{flex:1;max-width:160px;border:0;border-radius:10px 10px 0 0;padding:9px;font:600 15px Cairo,Tahoma;background:#0b4c46;color:#cfe5e0;cursor:pointer}
nav button.on{background:var(--mint);color:var(--teal)}
main{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.row{display:flex;gap:8px;align-items:center}
input,select{width:100%;padding:10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;font:15px Cairo,Tahoma;background:#fff;color:var(--ink)}
input[type=checkbox]{width:auto;margin:0 0 0 6px}input[type=range]{padding:0}
button{border:0;border-radius:8px;padding:10px 14px;font:600 15px Cairo,Tahoma;background:var(--teal);color:#fff;cursor:pointer;white-space:nowrap}
button.sec{background:#dbe9e5;color:var(--teal)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f2a900;outline-offset:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{padding:5px 12px;border:1px solid var(--teal);border-radius:20px;cursor:pointer;font-size:14px;background:#fff}
.chip.on{background:var(--teal);color:#fff}
.ph b{font-size:17px}
.bar{height:6px;background:#e3ece8;border-radius:3px;margin:8px 0;position:relative}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--teal);border-radius:3px;direction:ltr}
.meta{display:flex;flex-wrap:wrap;gap:12px;font-size:14px;color:var(--mut)}
.meta b{color:var(--ink)}
.tag{font-size:12px;padding:1px 8px;border-radius:10px;background:#d9f0e4;color:#0a6b3b}
.tag.x{background:#fde2de;color:var(--red)}
.acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.acts a{padding:8px 12px;border-radius:8px;background:#dbe9e5;color:var(--teal);text-decoration:none;font-size:14px;font-weight:600}
.muted{color:var(--mut)}
.demo{background:#fff4d6;border:1px solid #f0d58a;color:#6b4e00;padding:8px 12px;border-radius:8px;font-size:13px}
h3,h4{margin:14px 0 4px}
small{color:var(--mut)}
.filebtn{display:inline-block;border-radius:8px;padding:10px 14px;font:600 15px Cairo,Tahoma;cursor:pointer;white-space:nowrap;background:#dbe9e5;color:var(--teal)}
.auth{max-width:420px;margin:0 auto}
.hero{text-align:center;padding:18px 0 4px}
.hero .logo{width:64px;height:64px;margin:0 auto 6px;border-radius:18px;background:var(--teal);display:grid;place-items:center;font-size:32px}
.hero h2{margin:0;font-size:28px;font-weight:800}.hero p{margin:4px 0 0;color:var(--mut);font-size:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:#e3ece8;border-radius:10px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{background:transparent;color:var(--mut)}.seg button.on{background:#fff;color:var(--teal);box-shadow:0 1px 3px #0002}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--mut);margin:10px 0 2px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.rc{border:2px solid var(--line);border-radius:12px;padding:10px;text-align:center;cursor:pointer}
.rc span{display:block;font-size:26px}.rc small{display:block}.rc.on{border-color:var(--teal);background:#e6f3f0}
.pw{display:flex;gap:6px;align-items:center}.pw input{flex:1}.eye{padding:9px 10px;font-size:13px}
.big{width:100%;margin-top:14px;padding:12px;font-size:17px}
#sm{font-size:13px;margin:4px 0;color:var(--amber)}
</style>
</head>
<body>
<header>
  <div><h1>دوائي</h1><p>لاقي دواءك في أقرب صيدلية</p></div>
  <button id="out" class="sec" onclick="logout()" hidden>خروج</button>
</header>
<main id="app"><p class="muted">جاري التحميل…</p></main>
<script>
// ===== إعدادات Firebase: سيبها فاضية للتجربة المحلية، أو املاها من Firebase Console =====
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyC4-Beqe6wneaaIarMPMlcVCKz4T1GfF0c",
  authDomain: "dawaay.firebaseapp.com",
  projectId: "dawaay",
  storageBucket: "dawaay.firebasestorage.app",
  messagingSenderId: "388101444795",
  appId: "1:388101444795:web:e3f5fe4da002dc4e61859e"
};

// قاعدة الأدوية: ملف drugs.json (25 ألف دواء مصري [id, عربي, إنجليزي, المادة الفعالة, السعر])
// المصدر: karem505/egyptian-drug-database (ترخيص CC0)
let D = [], NN = [], TK = [];
const DM = new Map(), IG = new Map(), BCS = new Map();
const bcn = c => String(c).replace(/^0+/, '');
const ingKey = s => (s || '').toUpperCase().replace(/\([^)]*\)/g, '').split('+').map(x => x.trim()).filter(Boolean).sort().join('+');
async function loadDrugs() {
  D = await (await fetch('drugs.json')).json();
  D.forEach(d => {
    DM.set(d[0], d); const n1 = norm(d[1]), n2 = norm(d[2]); NN.push([n1, n2, norm(d[3])]); TK.push([n1.split(' '), n2.split(' ')]);
    const k = ingKey(d[3]); if (k) { if (!IG.has(k)) IG.set(k, []); IG.get(k).push(d[0]); }
  });
  try { const b = await (await fetch('barcodes.json')).json(); for (const c in b) BCS.set(bcn(c), b[c]); } catch (e) {}
}

const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const drug = id => DM.get(id);
const dn = id => { const d = drug(id); return d ? (d[1] || d[2]) : '؟'; };
const LS = 'dawaay_v1', CN = { ph:'pharmacies', inv:'inventory', res:'reservations', cu:'customers', bc:'barcodes' };
let S = { ph:[], inv:[], res:[], cu:[], bc:[] }, fs = null, role = localStorage.getItem('dv_role'), q = '', sel = null, rad = 50, openOnly = false;
let loc = JSON.parse(localStorage.getItem('dv_loc') || '[30.0444,31.2357]');
let my = localStorage.getItem('dv_my');
let user = null, fa = null, am = 'in', pend = null;

// ===== طبقة البيانات: Firestore لو الإعدادات موجودة، وإلا localStorage =====
function seed() {
  const P = [['النور',30.0459,31.2243,0],['مصر',30.0626,31.2497,0],['الشفاء',29.9602,31.2569,1],['السلام',30.0131,31.2089,0],['الحياة',30.0511,31.3656,0]];
  const ph = P.map((p,i) => ({ id:'s'+i, name:'صيدلية '+p[0]+' (تجريبي)', phone:'0100000000'+i, addr:'القاهرة', lat:p[1], lng:p[2], h24:!!p[3], o:'09:00', c:'23:00' }));
  const inv = [];
  return { ph, inv, res:[] };
}
async function load() {
  if (fs) {
    const g = async (k, qy) => (await fs.getDocs(qy || fs.collection(fs.db, CN[k]))).docs.map(d => ({ ...d.data(), id:d.id })), u = user.uid;
    S = { ph:await g('ph'), inv:await g('inv'), bc:await g('bc'), cu:[], res:[] };
    let r = await fs.getDoc(fs.doc(fs.db, 'users', u));
    if (!r.exists() && pend) { await fs.setDoc(fs.doc(fs.db, 'users', u), { role:pend }); r = await fs.getDoc(fs.doc(fs.db, 'users', u)); }
    pend = null; role = r.exists() ? r.data().role : null;
    my = S.ph.find(x => x.id == u) ? u : null;
    const rq = f => fs.query(fs.collection(fs.db, 'reservations'), fs.where(f, '==', u));
    if (role == 'h') S.res = await g('res', rq('p'));
    if (role == 'p') {
      const c = await fs.getDoc(fs.doc(fs.db, 'customers', u));
      if (c.exists()) S.cu = [{ ...c.data(), id:u }];
      S.res = await g('res', rq('c'));
    }
  } else {
    const s = localStorage.getItem(LS);
    S = { cu:[], bc:[], ...(s ? JSON.parse(s) : seed()) };
    localStorage.setItem(LS, JSON.stringify(S));
  }
}
async function put(k, o) {
  if (!o.id) o.id = k + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
  const i = S[k].findIndex(x => x.id == o.id);
  i < 0 ? S[k].push(o) : (S[k][i] = o);
  if (fs) await fs.setDoc(fs.doc(fs.db, CN[k], o.id), o);
  else localStorage.setItem(LS, JSON.stringify(S));
  return o;
}

// ===== البحث التقريبي (يتحمل الأخطاء الإملائية) =====
const norm = s => s.toLowerCase().replace(/[\u064B-\u0652\u0640]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/[^a-z0-9\u0621-\u064A ]/g,'').trim();
function lev(a, b, mx = 99) {
  const m = [...Array(b.length + 1).keys()];
  for (let i = 1; i <= a.length; i++) {
    let p = m[0], mn = (m[0] = i);
    for (let j = 1; j <= b.length; j++) { const t = m[j]; m[j] = Math.min(m[j] + 1, m[j-1] + 1, p + (a[i-1] == b[j-1] ? 0 : 1)); p = t; if (m[j] < mn) mn = m[j]; }
    if (mn > mx) return mx + 1;
  }
  return m[b.length];
}
function find(raw) {
  const s = norm(raw); if (s.length < 2) return [];
  const k = s.split(' ').length, res = [];
  for (let i = 0; i < D.length; i++) {
    let sc = 0;
    for (let j = 0; j < 2; j++) {
      const n = NN[i][j]; if (!n) continue;
      if (n.startsWith(s)) { sc = 1; break; }
      if (n.includes(s)) { sc = Math.max(sc, .95); continue; }
      const t = TK[i][j], pre = t.slice(0, k).join(' '), mx = Math.floor(.3 * Math.max(s.length, pre.length));
      if (Math.abs(pre.length - s.length) <= 4) sc = Math.max(sc, 1 - lev(s, pre, mx) / Math.max(s.length, pre.length));
      if (k == 1) for (const w of t) if (Math.abs(w.length - s.length) <= 3) sc = Math.max(sc, 1 - lev(s, w, Math.floor(.3 * Math.max(s.length, w.length))) / Math.max(s.length, w.length));
    }
    if (sc < 1 && NN[i][2].includes(s)) sc = Math.max(sc, .9);
    if (sc >= .7) res.push([i, sc]);
  }
  return res.sort((x, y) => y[1] - x[1] || D[x[0]][2].length - D[y[0]][2].length).slice(0, 8).map(x => D[x[0]]);
}
const hav = (a,b,c,d) => { const r = x => x*Math.PI/180, u = r(c-a), v = r(d-b), h = Math.sin(u/2)**2 + Math.cos(r(a))*Math.cos(r(c))*Math.sin(v/2)**2; return 12742*Math.asin(Math.sqrt(h)); };
function isOpen(p) {
  if (p.h24) return true;
  const n = new Date(), t = n.getHours()*60 + n.getMinutes(), f = s => { const [a,b] = s.split(':'); return a*60 + +b; }, o = f(p.o), c = f(p.c);
  return o <= c ? t >= o && t < c : t >= o || t < c;
}
const availBy = f => S.inv.filter(i => i.q > 0 && f(i.d)).map(i => {
  const p = S.ph.find(x => x.id == i.p);
  return p && { ...i, p, km: hav(loc[0], loc[1], p.lat, p.lng) };
}).filter(x => x && x.km <= rad && (!openOnly || isOpen(x.p)))  .sort((a,b) => a.km - b.km);
const avail = id => availBy(x => x == id);

// ===== واجهة المريض =====
function card(r, sd) {
  const p = r.p, w = Math.max(4, 100 - r.km / rad * 100), op = isOpen(p);
  return `<div class="card ph"><div class="row" style="justify-content:space-between"><b>${esc(p.name)}</b><span class="tag ${op?'':'x'}">${op?(p.h24?'24 ساعة':'مفتوحة'):'مقفولة'}</span></div>
  ${sd ? `<div><b>${esc(dn(r.d))}</b></div>` : ''}
  <div class="bar" title="القرب"><i style="width:${w}%"></i></div>
  <div class="meta"><span><b>${r.km.toFixed(1)}</b> كم</span><span>الكمية: <b>${r.q}</b></span><span>السعر: <b>${r.pr}</b> ج</span></div>
  <small>${esc(p.addr)}</small>
  <div class="acts"><a href="https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}" target="_blank" rel="noopener">الاتجاهات</a>
  <a href="tel:${esc(p.phone)}">اتصل</a><button onclick="reserve('${p.id}','${r.d}')">احجز</button></div></div>`;
}
function alts(d) {
  const g = new Set(IG.get(ingKey(d[3])) || []); g.delete(d[0]);
  const r = g.size ? availBy(x => g.has(x)).slice(0, 8) : [];
  return r.length
    ? `<h3>بدائل بنفس المادة الفعالة (${esc(d[3])})</h3>` + r.map(x => card(x, 1)).join('')
    : `<p class="muted">مفيش بدائل متوفرة في النطاق ده. جرّب تزوّد المسافة.</p>`;
}
function search() {
  const m = find(q);
  if (!m.length) sel = null; else if (!m.find(d => d[0] == sel)) sel = m[0][0];
  let h = `<div class="card"><div class="row"><input id="q" placeholder="اسم الدواء (حتى لو فيه غلط إملائي)" value="${esc(q)}" onkeydown="if(event.key=='Enter'){q=this.value;refresh()}">
  <button class="sec" onclick="mic()" aria-label="بحث صوتي">🎤</button><button onclick="q=$('#q').value;refresh()">بحث</button></div>
  <label>المسافة: <b id="rv">${rad}</b> كم<input type="range" min="1" max="200" value="${rad}" oninput="rad=+this.value;$('#rv').textContent=rad" onchange="render()"></label>
  <label><input type="checkbox" ${openOnly?'checked':''} onchange="openOnly=this.checked;render()">المفتوحة الآن بس</label>
  <div class="row" style="justify-content:space-between"><small>موقعك: ${loc.map(x => x.toFixed(3)).join('، ')}</small><button class="sec" onclick="gps()">حدد موقعي</button></div></div>`;
  if (q && !m.length) h += `<p class="muted">مفيش دواء بالاسم ده في القاعدة.</p>`;
  if (m.length) {
    h += `<div class="chips">${m.map(d => `<span class="chip ${d[0]==sel?'on':''}" onclick="sel='${d[0]}';render()">${d[1]} · ${d[2]}</span>`).join('')}</div>`;
    const d = drug(sel), r = avail(d[0]);
    h += r.length ? r.map(card).join('') : `<div class="card"><b>${d[1]}</b> مش متوفر في نطاق ${rad} كم.</div>` + alts(d);
  }
  return h;
}

// ===== تسجيل العميل وبياناته =====
let cv = 's';
const me = () => S.cu.find(x => x.id == (user ? user.uid : localStorage.getItem('dv_cu')));
const custForm = c => `<div class="card"><input id="n" placeholder="الاسم" value="${esc(c?.name)}"><input id="ph" type="tel" placeholder="رقم التليفون" value="${esc(c?.phone)}"><input id="ad" placeholder="العنوان" value="${esc(c?.addr)}">
  <div class="row"><input id="la" placeholder="خط العرض" value="${c?.lat ?? loc[0]}"><input id="lo" placeholder="خط الطول" value="${c?.lng ?? loc[1]}"><button class="sec" onclick="gps(1)">موقعي</button></div>
  <label>الأدوية اللي بتاخدها (لو بتاخد، افصل بينهم بفاصلة)<input id="md" placeholder="مثال: كونكور، جلوكوفاج" value="${esc((c?.meds || []).join('، '))}"></label>
  <button onclick="saveCu()">${c ? 'حفظ' : 'تسجيل'}</button></div>`;
function patient() {
  if (!me()) return '<h3>بيانات العميل</h3>' + custForm(null);
  return `<div class="row"><button class="${cv=='s'?'':'sec'}" onclick="cv='s';render()">بحث عن دواء</button><button class="${cv=='p'?'':'sec'}" onclick="cv='p';render()">بياناتي وأدويتي</button></div>` + (cv == 's' ? search() : '<h3>بياناتي</h3>' + custForm(me()));
}
async function saveCu() {
  const v = i => $('#'+i).value.trim(), o = { ...me(), ...(user ? { id:user.uid } : {}), name:v('n'), phone:v('ph'), addr:v('ad'), lat:parseFloat(v('la')), lng:parseFloat(v('lo')), meds:v('md').split(/[,،\n]/).map(x => x.trim()).filter(Boolean) };
  if (!o.name || !o.phone || !o.addr || isNaN(o.lat) || isNaN(o.lng)) return alert('كمّل الاسم والتليفون والعنوان والموقع.');
  loc = [o.lat, o.lng]; localStorage.setItem('dv_loc', JSON.stringify(loc));
  localStorage.setItem('dv_cu', (await put('cu', o)).id); cv = 's'; render();
}

// ===== واجهة الصيدلية =====
function pharm() {
  const p = S.ph.find(x => x.id == my);
  if (!p) return `<div class="card"><h3>سجّل صيدليتك</h3>
  <input id="n" placeholder="اسم الصيدلية"><input id="ph" type="tel" placeholder="رقم الهاتف"><input id="ad" placeholder="العنوان">
  <div class="row"><input id="la" placeholder="خط العرض" value="${loc[0]}"><input id="lo" placeholder="خط الطول" value="${loc[1]}"><button class="sec" onclick="gps(1)">موقعي</button></div>
  <label><input type="checkbox" id="h24">شغالة 24 ساعة</label>
  <div class="row"><input id="o" type="time" value="09:00"><input id="c" type="time" value="23:00"></div>
  <button onclick="reg()">تسجيل الصيدلية</button></div>`;
  const inv = S.inv.filter(i => i.p == p.id && drug(i.d)), rs = S.res.filter(r => r.p == p.id).sort((a,b) => b.at - a.at);
  return `<div class="card"><b>${esc(p.name)}</b><br><small>${esc(p.addr)}</small></div>
  <div class="card"><h3>أضف أو حدّث دواء</h3>
  <div class="row"><input id="bc" placeholder="باركود الدواء (اختياري)" onchange="setBc(this.value)"><button class="sec" onclick="scan()">📷 صوّر</button><label class="filebtn">📁 صورة<input type="file" accept="image/*" capture="environment" hidden onchange="scanFile(this.files[0]);this.value=''"></label></div>
  <div id="rd" style="width:100%" onclick="stopCam()"></div><div id="sm"></div>
  <input id="dq" placeholder="ابحث عن الدواء بالاسم (عربي أو إنجليزي)" oninput="dsearch(this.value)"><div id="dres" class="chips"></div><div id="dsel" class="muted"></div>
  <div class="row"><input id="qq" type="number" min="0" placeholder="الكمية"><input id="pr" type="number" min="0" step="0.5" placeholder="السعر"></div>
  <button onclick="addInv()">حفظ</button></div>
  <h3>المخزون (${inv.length})</h3>
  ${inv.map(i => `<div class="card row"><span style="flex:1">${esc(dn(i.d))}</span><input style="width:80px" type="number" min="0" value="${i.q}" onchange="upd('${i.id}','q',this.value)" aria-label="الكمية"><input style="width:90px" type="number" min="0" step="0.5" value="${i.pr}" onchange="upd('${i.id}','pr',this.value)" aria-label="السعر"></div>`).join('') || '<p class="muted">لسه مفيش أدوية. ضيف أول دواء من فوق.</p>'}
  <h3>طلبات الحجز (${rs.length})</h3>
  ${rs.map(r => `<div class="card row" style="justify-content:space-between"><span>${esc(dn(r.d))} — ${esc(r.n)} <small>${esc(r.t)}</small></span>${r.s=='pending'?`<button onclick="conf('${r.id}')">أكّد</button>`:'<span class="tag">متأكد</span>'}</div>`).join('') || '<p class="muted">مفيش طلبات حجز.</p>'}`;
}

// ===== الأحداث =====
async function reg() {
  const v = i => $('#'+i).value.trim(), o = { ...(user ? { id:user.uid } : {}), name:v('n'), phone:v('ph'), addr:v('ad'), lat:parseFloat(v('la')), lng:parseFloat(v('lo')), h24:$('#h24').checked, o:v('o'), c:v('c') };
  if (!o.name || !o.phone || isNaN(o.lat) || isNaN(o.lng)) return alert('كمّل الاسم والهاتف والموقع.');
  my = (await put('ph', o)).id; localStorage.setItem('dv_my', my); render();
}
async function addInv() {
  const d = selD, qv = parseInt($('#qq').value), pr = parseFloat($('#pr').value);

const sm = t => { const e = $('#sm'); if (e) e.textContent = t; };
const fmts = () => { const F = Html5QrcodeSupportedFormats; return [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128, F.CODE_39, F.QR_CODE]; };
async function loadH5() {
  if (window.Html5Qrcode) return true;
  await new Promise(ok => { const t = document.createElement('script'); t.src = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js'; t.onload = ok; t.onerror = ok; document.head.appendChild(t); });
  return !!window.Html5Qrcode;
}
async function stopCam() { if (h5) { try { await h5.stop(); h5.clear(); } catch (e) {} h5 = null; } }
async function scan() {
  sm('جاري فتح الكاميرا…');
  if (!await loadH5()) return sm('تعذر تحميل مكتبة الباركود (اتأكد من الإنترنت). جرّب زرار "صورة" أو اكتب الرقم.');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return sm('المتصفح مش بيسمح بالكاميرا هنا. جرّب زرار "صورة".');
  await stopCam();
  const ok = async t => { await stopCam(); sm(''); setBc(t); };
  const go = async c => { h5 = new Html5Qrcode('rd', { formatsToSupport:fmts(), experimentalFeatures:{ useBarCodeDetectorIfSupported:true } }); await h5.start(c, { fps:10, qrbox:{ width:250, height:130 } }, ok, () => {}); sm('وجّه الكاميرا على الباركود (اضغط على الصورة للإغلاق).'); };
  try { await go({ facingMode:'environment' }); }
  catch (e) {
    try { const cs = await Html5Qrcode.getCameras(); if (!cs.length) throw e; await go(cs[cs.length - 1].id); }
    catch (e2) { h5 = null; sm('الكاميرا مش بتفتح (' + ((e2 && (e2.name || e2.message)) || e2) + '). لو الإذن مرفوض: اضغط على القفل جنب الرابط ثم الأذونات ثم الكاميرا ثم سماح، وحدّث الصفحة. أو استخدم زرار "صورة".'); }
  }
}
async function scanFile(f) {
  if (!f) return;
  sm('بقرا الباركود من الصورة…');
  if (!await loadH5()) return sm('تعذر تحميل مكتبة الباركود. اكتب الرقم بإيدك.');
  await stopCam();
  try { const h = new Html5Qrcode('rd', { formatsToSupport:fmts() }); const t = await h.scanFile(f, false); try { h.clear(); } catch (e) {} sm(''); setBc(t); }
  catch (e) { sm('معرفتش أقرا باركود من الصورة. صوّر من قريب والباركود واضح ومواجه الكاميرا، أو اكتب الرقم.'); }
}
